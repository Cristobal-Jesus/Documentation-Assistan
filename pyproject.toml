readme = "README.md"
authors = [
    { name = "Cristobal-Jesus", email = "sarmiento.cs16@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.7.22",
    "deepagents>=0.7.21",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
]

[project.scripts]
documentation-assistan = "documentation_assistan:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
